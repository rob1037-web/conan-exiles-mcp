[package]
name = "mcp-server"
edition.workspace = true
version.workspace = true

[dependencies]
anyhow = "1.0.104"
conan-core = { version = "0.1.0", path = "../core" }
rmcp = { version = "3.5.1", features = ["server", "macros", "transport-io"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
socket2 = { version = "0.6.5", features = ["all"] }
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "io-std", "io-util", "sync"] }
uuid = { version = "1.28.0", features = ["v4"] }

[dev-dependencies]
rmcp = { version = "3.5.1", features = ["client"] }
tempfile = "3.27.0"
